<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agentic Corpus · local desk</title>
    <style>
      :root {
        --ink: #efe7db; --muted: #8d867b; --bg: #07080c;
        --panel: rgba(10, 12, 16, 0.92); --line: #2a2d36; --accent: #d9a36a;
        --ok: #6db3a8; --bad: #c45c26;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      #graph { position: fixed; inset: 0; }
      .top { position: fixed; z-index: 4; left: 0; right: 0; top: 0;
        display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
        padding: 12px 14px calc(8px + env(safe-area-inset-top));
        background: linear-gradient(180deg, #07080c 0%, transparent 100%); pointer-events: none; }
      .top h1 { margin: 0; font-size: 16px; font-weight: 560; }
      .top p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
      .badge { pointer-events: auto; font-size: 11px; color: var(--muted);
        border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--panel); }
      .desk { position: fixed; z-index: 4; left: 12px; top: 58px; bottom: 12px;
        width: min(400px, 92vw); display: flex; flex-direction: column; gap: 8px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        padding: 10px 12px; backdrop-filter: blur(14px); }
      .card h2 { margin: 0 0 8px; font-size: 10px; letter-spacing: .14em;
        text-transform: uppercase; color: #9a8f7a; font-weight: 650; }
      #feed { flex: 1; overflow: auto; min-height: 0; }
      .tools { display: flex; gap: 6px; flex-wrap: wrap; }
      .tools input { flex: 1; min-width: 120px; background: #0d1016; color: var(--ink);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; }
      .chip { border: 1px solid var(--line); background: transparent; color: var(--muted);
        border-radius: 999px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
      .chip.on { color: var(--ink); border-color: var(--accent); background: rgba(217,163,106,.12); }
      .health { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .health span { font-size: 10px; color: var(--muted); }
      .health .ok { color: var(--ok); } .health .fail { color: var(--bad); }
      .item { padding: 9px 0; border-top: 1px solid #1d2028; cursor: pointer; }
      .item:first-of-type { border-top: 0; }
      .item a { color: var(--ink); text-decoration: none; font-size: 13.5px; line-height: 1.35; }
      .item a:hover { color: var(--accent); }
      .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
      .sum { color: #b7b0a4; font-size: 12px; margin-top: 4px; line-height: 1.4; }
      .inspect { position: fixed; z-index: 4; right: 12px; top: 58px; width: min(300px, 90vw); }
      .inspect a { color: var(--accent); }
      @media (max-width: 820px) {
        .desk { left: 8px; right: 8px; top: auto; bottom: 0; width: auto; height: 48vh; max-height: 420px; }
        .inspect { left: 8px; right: 8px; top: auto; bottom: calc(48vh + 6px); width: auto; }
        #graph { bottom: 46vh; }
      }
    </style>
    <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  </head>
  <body>
    <div id="graph"></div>
    <header class="top">
      <div>
        <h1>Local desk</h1>
        <p>Public APIs → inbox.json → this graph. Aether stays parked.</p>
      </div>
      <div class="badge" id="stamp">loading…</div>
    </header>
    <section class="desk">
      <div class="card">
        <h2>Filters</h2>
        <div class="tools"><input id="q" type="search" placeholder="filter title / source" autocomplete="off" /></div>
        <div class="tools" id="chips" style="margin-top:7px"></div>
        <div class="health" id="health"></div>
      </div>
      <div class="card" id="feed">
        <h2>Inbox</h2>
        <div id="list">Run <code>npm run collect && npm run local</code>. file:// blocks fetch.</div>
      </div>
    </section>
    <aside class="card inspect" id="panel">
      <h2>Inspect</h2>
      <p class="meta">Click a body or an inbox row.</p>
    </aside>
    <script>
      const COLORS = { paradigm:"#d9a36a", method:"#6db3a8", structure:"#7aa2d4", tool:"#c27a9a", lab:"#c45c26", paper:"#b7b39a", signal:"#e8d7a3" };
      const SOURCE_COLOR = { arxiv:"#b7b39a", hn:"#ff6600", "hf-daily":"#ffcc4d", openalex:"#9ad0c8", lobsters:"#ac130d", devto:"#9b7bff", github:"#7aa2d4", simonw:"#6db3a8", "latent-space":"#d9a36a", "import-ai":"#c27a9a" };
      const HOOKS = [
        { re: /graph.?engineer|graphrag|knowledge graph|control graph/i, id: "graph-engineering" },
        { re: /harness.?evol/i, id: "harness-evolution" },
        { re: /harness/i, id: "agent-harness" },
        { re: /memory/i, id: "memory-graphs" },
        { re: /loop/i, id: "loop-engineering" },
        { re: /context/i, id: "context-engineering" },
        { re: /eval|gate/i, id: "evals-gates" },
        { re: /webllm/i, id: "webllm" }
      ];
      function hookOf(text) { for (const h of HOOKS) if (h.re.test(text)) return h.id; return "inbox-today"; }
      async function loadJson(path) { const r = await fetch(path); if (!r.ok) throw new Error(path + " " + r.status); return r.json(); }
      function esc(s) { return String(s || "").replace(/[&<>"']/g, function (c) { return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]; }); }
      let STATE = { inbox: { items: [] }, graph: null, source: "all", q: "" };
      function filtered() {
        const q = STATE.q.trim().toLowerCase();
        return (STATE.inbox.items || []).filter(function (it) {
          if (STATE.source !== "all" && it.source !== STATE.source) return false;
          if (!q) return true;
          return (it.title + " " + (it.summary || "") + " " + it.source).toLowerCase().indexOf(q) >= 0;
        });
      }
      function inspect(html) { document.getElementById("panel").innerHTML = html; }
      function showItem(it) {
        inspect("<h2>" + esc(it.source) + "</h2><p><strong>" + esc(it.title) + "</strong></p><p class='meta'>" + esc(it.kind || "") + " · " + esc(it.date || "—") + " · heat " + (it.heat == null ? "—" : it.heat) + "</p><p class='sum'>" + esc(it.summary || "") + "</p><p class='meta'><a href='" + esc(it.url) + "' target='_blank' rel='noopener'>open source ↗</a></p>");
      }
      function renderList() {
        const items = filtered();
        const list = document.getElementById("list");
        if (!items.length) { list.innerHTML = "<p class='meta'>No rows for this filter. npm run collect if inbox is empty.</p>"; return; }
        list.innerHTML = items.map(function (it, i) {
          return "<div class='item' data-i='" + i + "'><a href='" + esc(it.url) + "' target='_blank' rel='noopener'>" + esc(it.title) + "</a><div class='meta'>" + esc(it.source) + " · " + esc(it.kind || "") + " · " + esc(it.date || "—") + " · heat " + (it.heat == null ? "—" : it.heat) + "</div>" + (it.summary ? "<div class='sum'>" + esc(it.summary) + "</div>" : "") + "</div>";
        }).join("");
        list.querySelectorAll(".item").forEach(function (el) {
          el.addEventListener("click", function (ev) {
            if (ev.target.tagName === "A") return;
            showItem(items[+el.getAttribute("data-i")]);
          });
        });
      }
      function renderChrome(inbox) {
        document.getElementById("stamp").textContent = (inbox.collected_at || "").replace("T", " ").slice(0, 16) + " · " + ((inbox.items && inbox.items.length) || 0) + " items";
        const sources = ["all"].concat(Array.from(new Set((inbox.items || []).map(function (x) { return x.source; }))).sort());
        const chips = document.getElementById("chips");
        chips.innerHTML = sources.map(function (s) { return "<button class='chip" + (s === STATE.source ? " on" : "") + "' data-s='" + esc(s) + "'>" + esc(s) + "</button>"; }).join("");
        chips.querySelectorAll("button").forEach(function (b) {
          b.addEventListener("click", function () { STATE.source = b.getAttribute("data-s"); renderChrome(inbox); renderList(); });
        });
        const health = document.getElementById("health");
        const h = inbox.health || {};
        const keys = Object.keys(h);
        health.innerHTML = keys.length ? keys.map(function (k) { const v = h[k]; return "<span class='" + (v.ok ? "ok" : "fail") + "'>" + esc(k) + " " + (v.ok ? v.count : "×") + "</span>"; }).join("") : "<span>no health block — run the new collector</span>";
      }
      function mergeGraph(raw, inbox) {
        const nodes = raw.nodes.map(function (n) { return Object.assign({}, n); });
        const links = raw.edges.map(function (e) { return { source: e.from, target: e.to, rel: e.rel }; });
        const have = new Set(nodes.map(function (n) { return n.id; }));
        if (!have.has("inbox-today")) nodes.push({ id: "inbox-today", type: "signal", label: "Today inbox", heat: 3 });
        const seen = new Set();
        (inbox.items || []).slice(0, 40).forEach(function (it) {
          const id = "sig:" + it.id;
          if (seen.has(id)) return;
          seen.add(id);
          nodes.push({ id: id, type: "signal", label: (it.title || "").slice(0, 72), heat: it.heat || 2, src: it.source, url: it.url, summary: it.summary, kind: it.kind });
          const hook = hookOf(it.title + " " + (it.summary || ""));
          links.push({ source: id, target: have.has(hook) ? hook : "inbox-today", rel: "signals" });
        });
        return { nodes: nodes, links: links };
      }
      Promise.all([
        loadJson("./graph.json"),
        loadJson("./inbox.json").catch(function () { return { items: [], collected_at: "", health: {} }; })
      ]).then(function (pair) {
        var raw = pair[0], inbox = pair[1];
        STATE.inbox = inbox;
        var gData = mergeGraph(raw, inbox);
        STATE.graph = ForceGraph3D()(document.getElementById("graph"))
          .graphData(gData).backgroundColor("#07080c")
          .nodeLabel(function (n) { return n.label; }).nodeRelSize(4)
          .nodeVal(function (n) { return (n.heat || 2) * (String(n.id).indexOf("sig:") === 0 ? 0.7 : 1.4); })
          .nodeColor(function (n) { return (n.src && SOURCE_COLOR[n.src]) || COLORS[n.type] || "#888"; })
          .linkColor(function () { return "rgba(180,170,150,0.28)"; }).linkOpacity(0.35).linkDirectionalArrowLength(2.4)
          .onNodeClick(function (n) {
            if (n.url) { showItem({ source: n.src || n.type, title: n.label, url: n.url, date: "", heat: n.heat, summary: n.summary || "", kind: n.kind || n.type }); return; }
            var neigh = gData.links.filter(function (l) {
              var s = l.source.id || l.source, t = l.target.id || l.target; return s === n.id || t === n.id;
            }).map(function (l) {
              var s = l.source.id || l.source, t = l.target.id || l.target;
              var otherId = s === n.id ? t : s;
              var other = gData.nodes.find(function (x) { return x.id === otherId; });
              return (l.rel || "") + " → " + ((other && other.label) || otherId);
            });
            inspect("<h2>" + esc(n.type || "node") + "</h2><p><strong>" + esc(n.label) + "</strong></p><p class='meta'>heat " + (n.heat == null ? "?" : n.heat) + "</p><p class='meta'>" + (neigh.slice(0, 12).join("<br>") || "no neighbors") + "</p>");
          });
        STATE.graph.d3Force("charge").strength(-80);
        renderChrome(inbox); renderList();
        document.getElementById("q").addEventListener("input", function (e) { STATE.q = e.target.value; renderList(); });
      }).catch(function (err) { document.getElementById("list").textContent = err.message; });
    </script>
  </body>
</html>
